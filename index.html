<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santos | Maturidade Tributária</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.box{max-width:680px;margin:40px auto;background:white;padding:32px;border-radius:22px;box-shadow:0 15px 45px #062b5920}h1,h2{color:#062b59}button{width:100%;padding:15px;background:#062b59;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:12px}input[type=text],input[type=tel]{width:100%;padding:14px;box-sizing:border-box;margin:7px 0 16px;border:1px solid #ccd5e0;border-radius:9px}.opt{display:block;border:1px solid #ccd5e0;padding:14px;margin:10px 0;border-radius:11px}.hidden{display:none}.score{font-size:52px;text-align:center;font-weight:900;color:#062b59}.brand{font-weight:800;color:#062b59}.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}.nps label{border:1px solid #ccd5e0;padding:10px 0;text-align:center}.nps input{display:none}.nps label:has(input:checked){background:#062b59;color:white}</style><div class="box"><div class="brand">SANTOS CONTABILIDADE E CONSULTORIA</div><section id="s"><h1>Sua empresa está preparada para a Reforma Tributária?</h1><p>Responda e descubra seu nível de preparação.</p><button onclick="go('i')">COMEÇAR</button></section><section id="i" class="hidden"><h2>Identificação</h2><label>Empresa</label><input id="empresa" type="text"><label>WhatsApp</label><input id="telefone" type="tel"><button onclick="start()">CONTINUAR</button></section><section id="q" class="hidden"><small id="num"></small><h2 id="qt"></h2><div id="op"></div><button onclick="next()">PRÓXIMA</button></section><section id="n" class="hidden"><h2>NPS</h2><p>De 0 a 10, quanto você recomendaria a Santos Contabilidade?</p><div id="nopts" class="nps"></div><button onclick="finish()">VER RESULTADO</button></section><section id="r" class="hidden"><h2>Seu nível de maturidade tributária</h2><p id="nivel"></p><div id="sc" class="score"></div><p id="txt"></p><button onclick="location.href='https://wa.me/554799302576'">QUERO SABER MAIS</button></section></div><script>const ENDPOINT=""https://script.google.com/macros/s/AKfycby_L8Ll2BhJtZHqzyQq5eGF4DEtkzrQSQJNSNCAEFPqMzZ4LxxQBHDwnCE70O-qXlEKdA/exec";const qs=[["Você entende como a Reforma Tributária poderá afetar sua empresa?",["Não conheço os impactos","Conheço parcialmente","Já avaliei os impactos"]],["Sua empresa já simulou como CBS e IBS poderão afetar os impostos?",["Ainda não","Estamos estudando","Já realizamos simulações"]],["Você sabe se os preços e as margens de lucro precisarão ser revisados?",["Não sei","Tenho algumas estimativas","Já fizemos uma análise"]],["Sua empresa já avaliou os possíveis créditos tributários nas compras?",["Não","Parcialmente","Sim, de forma estruturada"]],["Seu sistema de gestão ou emissão de notas está sendo preparado?",["Ainda não","Estamos verificando","Já temos um plano de adequação"]],["Sua empresa possui um planejamento para a transição tributária?",["Não possui","Está em desenvolvimento","Sim, com ações definidas"]],["Você já conversou com sua contabilidade sobre os impactos específicos no seu negócio?",["Ainda não","Tivemos uma conversa inicial","Já fizemos uma análise individual"]]];let i=0,a=[];function go(x){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));document.getElementById(x).classList.remove("hidden")}function start(){go("q");render()}function render(){num.textContent=`Pergunta ${i+1} de 7`;qt.textContent=qs[i][0];op.innerHTML=qs[i][1].map((x,k)=>`<label class="opt"><input type="radio" name="q" value="${k*50}"> ${x}</label>`).join("")}function next(){let s=document.querySelector('input[name=q]:checked');if(!s)return alert("Escolha uma resposta.");a[i]=+s.value;i++;if(i<7)render();else{go("n");nopts.innerHTML=Array.from({length:11},(_,k)=>`<label><input type="radio" name="n" value="${k}">${k}</label>`).join("")}}async function finish(){let s=document.querySelector('input[name=n]:checked');if(!s)return alert("Escolha uma nota.");let n=+s.value,score=Math.round(a.reduce((x,y)=>x+y,0)/7),nivel=score<40?"🔴 MATURIDADE BAIXA":score<75?"🟡 MATURIDADE INTERMEDIÁRIA":"🟢 MATURIDADE AVANÇADA";document.getElementById("nivel").textContent=nivel;sc.textContent=score+"%";txt.textContent=score<40?"Sua empresa ainda possui pontos importantes que precisam ser avaliados para a transição tributária.":score<75?"Sua empresa já iniciou a preparação, mas ainda existem pontos que precisam ser aprofundados.":"Sua empresa demonstra um bom nível de preparação e já possui ações importantes para enfrentar a transição tributária.";go("r");if(ENDPOINT.startsWith("http"))try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify({empresa:empresa.value,telefone:telefone.value,answers:a,nps:n})})}catch(e){}}</script></html>
